name: AOIInstantReplay
options:
  bundleIdPrefix: com.aoi
  deploymentTarget:
    iOS: 15.0
  xcodeVersion: 15.0

settings:
  SWIFT_VERSION: 5.9
  TARGETED_DEVICE_FAMILY: 1,2
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"

targets:
  AOIInstantReplay:
    type: application
    platform: iOS
    bundleId: com.aoi.instantreplay
    sources:
      - path: AppDelegate.swift
      - path: MainViewController.swift
      - path: PiPReplayController.swift
      - path: CircularReplayBuffer.swift
    info:
      path: Info.plist
    dependencies:
      - target: AOIBroadcastExtension
    frameworks:
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: ReplayKit.framework

  AOIBroadcastExtension:
    type: app-extension
    platform: iOS
    bundleId: com.aoi.instantreplay.upload-extension
    sources:
      - path: SampleHandler.swift
      - path: CircularReplayBuffer.swift
    info:
      path: Extension-Info.plist
    frameworks:
      - sdk: ReplayKit.framework
      - sdk: AVFoundation.framework

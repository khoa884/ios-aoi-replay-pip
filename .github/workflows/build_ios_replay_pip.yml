name: Build iOS AOI Replay PiP IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios_aoi_replay_pip/**'
      - '.github/workflows/build_ios_replay_pip.yml'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & ldid
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project
        run: |
          cd ios_aoi_replay_pip
          xcodegen generate

      - name: Build App & Broadcast Extension
        run: |
          cd ios_aoi_replay_pip
          
          # Build target without embedding validation lock
          xcodebuild -project AOIInstantReplay.xcodeproj \
            -scheme AOIInstantReplay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            VALIDATE_PRODUCT=NO \
            VALIDATE_EMBEDDED_BINARY=NO \
            build > xcodebuild.log 2>&1 || {
              echo "=== XCODEBUILD FAILED ==="
              # Surface error lines directly as GitHub Actions check annotations
              grep -E "error:" xcodebuild.log | while read -r err; do
                echo "::error::$err"
              done
              tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Package Ad-hoc IPA for TrollStore / Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios_aoi_replay_pip/build -name "AOIInstantReplay.app" -type d | head -n 1)
          echo "Packaging application from: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Sign embedded extensions first, then main bundle
          find Payload/AOIInstantReplay.app -name "*.appex" -type d | while read -r ext; do
            echo "Signing extension: $ext"
            ldid -S "$ext" || true
          done
          
          echo "Signing main application bundle..."
          ldid -S Payload/AOIInstantReplay.app || true
          
          zip -r -q AOIInstantReplay.ipa Payload
          ls -lh AOIInstantReplay.ipa

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: ios_aoi_replay_pip/xcodebuild.log

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AOIInstantReplay-iOS
          path: AOIInstantReplay.ipa
